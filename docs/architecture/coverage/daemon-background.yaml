# Daemon & Background 守护进程与后台会话覆盖清单
version: 1

sections:
  - name: 守护进程注册与管理
    number: 2.1
    files:
      - src/daemon/main.ts
      - tests/daemon.test.ts
    tests:
      - Daemon status removes stale PID records
      - Worker registry accepts known workers and rejects unknown kinds

  - name: Supervisor 重启策略
    number: 2.1, 3.2
    files:
      - src/daemon/supervisor.ts
      - tests/daemon.test.ts
    tests:
      - Supervisor restarts failed workers with bounded exponential delays
      - Supervisor stops after maxRestarts instead of looping forever
      - Supervisor stop terminates the active worker without restarting

  - name: Worker 进程
    number: 2.1, 3.3
    files:
      - src/daemon/workerRegistry.ts
      - tests/daemon.test.ts

  - name: 后台会话启动与注册
    number: 2.2, 4.1
    files:
      - src/cli/bg.ts
      - tests/backgroundSessions.test.ts
    tests:
      - Registry ignores non-PID files and writes private atomic records
      - Non-interactive and tmux mode conflicts do not fall through to foreground
      - Spawn failure cleans the tmux session, registry and log in reverse order
      - Real tmux supports discovery, idempotent launch, logs, identity checks and idempotent kill

  - name: 后台会话授权与身份验证
    number: 4.2, 6.2
    files:
      - src/cli/bg.ts
      - tests/backgroundSessions.test.ts
    tests:
      - PID token mismatch fails closed before attach or kill authorization
      - Wrong UDS identity is a conflict rather than a stale-session cleanup

  - name: 后台会话终止与墓碑
    number: 4.4, 6.2
    files:
      - src/cli/bg.ts
      - tests/backgroundSessions.test.ts
    tests:
      - SIGTERM timeout rechecks identity before SIGKILL and leaves a readable tombstone

  - name: 后台会话日志
    number: 4.3
    files:
      - src/cli/bg.ts
      - tests/backgroundSessions.test.ts
    tests:
      - Logs retain order and truncate large output without changing permissions

  - name: UDS 注册表
    number: 2.3, 5.2
    files:
      - src/utils/udsRegistry.ts
      - tests/udsMessaging.test.ts

  - name: UDS 消息服务器
    number: 2.3, 5.1, 5.3
    files:
      - src/utils/udsMessaging.ts
      - tests/udsMessaging.test.ts
    tests:
      - Serves real UDS prompts, peer discovery, and teardown

  - name: UDS 客户端
    number: 2.3, 5.1, 5.2
    files:
      - src/utils/udsClient.ts
      - tests/udsMessaging.test.ts
    tests:
      - Removes stale registry entries instead of returning offline peers

  - name: 后台会话标志解析
    number: 4.1
    files:
      - src/cli/bgArgs.ts
      - tests/backgroundSessions.test.ts
    tests:
      - Background flags preserve option values and text after --

  - name: 后台内务
    number: 1
    files:
      - src/utils/backgroundHousekeeping.ts

  - name: 后台远程会话
    number: 1
    files:
      - src/utils/background/remote/remoteSession.ts
      - src/utils/background/remote/preconditions.ts

  - name: 守护进程 Bridge
    number: 1
    files:
      - src/assistant/daemonBridge.ts
      - tests/daemonBridge.test.ts
    tests:
      - Maps the handle and buffers inbound streams before teardown
      - Returns null when initialization fails

owners:
  primary: daemon
  secondary:
    - background
    - uds
