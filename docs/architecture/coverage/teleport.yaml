# Teleport 功能覆盖文档
# 记录 Teleport 模块的所有文件及其责任归属

schema_version: 1

system:
  name: teleport
  description: 会话迁移与恢复功能，支持本地-云端无缝切换
  owner: team-claude-code
  status: active

sections:
  - id: commands
    name: 命令层
    description: /teleport 命令实现
    files:
      - path: src/commands/teleport/index.ts
        responsibility: 注册 teleport 命令
        owner: teleport-module
        tests:
          - tests/teleport.test.ts

      - path: src/commands/teleport/teleport.tsx
        responsibility:  teleport 命令主逻辑，会话恢复流程
        owner: teleport-module
        tests:
          - tests/teleport.test.ts

  - id: components
    name: UI 组件层
    description: Teleport 相关 UI 组件
    files:
      - path: src/components/TeleportResumeWrapper.tsx
        responsibility: 恢复流程包装器，管理状态和错误
        owner: teleport-module
        tests:
          - tests/teleport.test.ts

      - path: src/components/TeleportError.tsx
        responsibility: 前置错误处理（登录、Git 状态）
        owner: teleport-module
        tests:
          - tests/teleport.test.ts

      - path: src/components/TeleportProgress.tsx
        responsibility: 进度显示组件，步骤可视化
        owner: teleport-module
        tests:
          - tests/teleport.test.ts

      - path: src/components/TeleportStash.tsx
        responsibility: 脏工作区 stash 对话框
        owner: teleport-module
        tests:
          - tests/teleport.test.ts

      - path: src/components/TeleportRepoMismatchDialog.tsx
        responsibility: 仓库不匹配时的路径选择
        owner: teleport-module
        tests:
          - tests/teleport.test.ts

  - id: hooks
    name: Hook 层
    description: Teleport React Hooks
    files:
      - path: src/hooks/useTeleportResume.tsx
        responsibility: 会话恢复状态管理 Hook
        owner: teleport-module
        tests:
          - tests/teleport.test.ts

  - id: utils
    name: 核心逻辑层
    description: Teleport 核心工具函数
    files:
      - path: src/utils/teleport.tsx
        responsibility: |
          Teleport 主逻辑模块
          - teleportToRemote：创建远程会话
          - teleportResumeCodeSession：恢复远程会话
          - validateSessionRepository：仓库验证
          - checkOutTeleportedSessionBranch：分支检出
          - processMessagesForTeleportResume：消息处理
          - generateTitleAndBranch：标题分支生成
          - archiveRemoteSession：归档远程会话
        owner: teleport-module
        tests:
          - tests/teleport.test.ts

  - id: utils-teleport
    name: Teleport 子模块
    description: teleport 目录下的专项模块
    files:
      - path: src/utils/teleport/api.ts
        responsibility: |
          Sessions API 客户端
          - fetchSession：获取单个会话
          - fetchCodeSessionsFromSessionsAPI：获取会话列表
          - sendEventToRemoteSession：发送事件到会话
          - updateSessionTitle：更新会话标题
          - getBranchFromSession：提取分支信息
        owner: teleport-module
        tests:
          - tests/teleport.test.ts

      - path: src/utils/teleport/environments.ts
        responsibility: |
          环境 API 客户端
          - fetchEnvironments：获取可用环境列表
          - createDefaultCloudEnvironment：创建默认云环境
        owner: teleport-module
        tests:
          - tests/teleport.test.ts

      - path: src/utils/teleport/environmentSelection.ts
        responsibility: |
          环境选择逻辑
          - getEnvironmentSelectionInfo：获取选中环境和来源
        owner: teleport-module
        tests:
          - tests/teleport.test.ts

      - path: src/utils/teleport/gitBundle.ts
        responsibility: |
          Git Bundle 创建与上传
          - createAndUploadGitBundle：创建 bundle 并上传
          - _bundleWithFallback：三级降级打包策略
        owner: teleport-module
        tests:
          - tests/teleport.test.ts

dependencies:
  - system: auth
    reason: 需要 OAuth 认证访问 Claude.ai API
    files:
      - src/utils/auth.ts

  - system: git
    reason: Git 操作（分支、stash、bundle）
    files:
      - src/utils/git.ts

  - system: session-ingress
    reason: 拉取远程会话日志
    files:
      - src/services/api/sessionIngress.ts

  - system: settings
    reason: 读取默认环境配置
    files:
      - src/utils/settings/settings.ts

  - system: analytics
    reason: 发送 Teleport 事件（tengu_teleport_*）
    files:
      - src/services/analytics/index.ts

  - system: model-api
    reason: Haiku 生成标题和分支名
    files:
      - src/utils/model/model.ts

test_suite:
  primary: tests/teleport.test.ts
  coverage_targets:
    - src/utils/teleport.tsx
    - src/utils/teleport/api.ts
    - src/utils/teleport/gitBundle.ts
    - src/commands/teleport/teleport.tsx
    - src/components/TeleportResumeWrapper.tsx
    - src/components/TeleportError.tsx
    - src/hooks/useTeleportResume.tsx

external_apis:
  - name: Sessions API
    endpoints:
      - GET /v1/sessions
      - GET /v1/sessions/{id}
      - POST /v1/sessions
      - POST /v1/sessions/{id}/events
      - PATCH /v1/sessions/{id}
      - POST /v1/sessions/{id}/archive

  - name: Environment API
    endpoints:
      - GET /v1/environment_providers
      - POST /v1/environment_providers/cloud/create

  - name: Files API
    endpoints:
      - POST /v1/files
    usage: 上传 Git Bundle

feature_flags:
  - name: tengu_ccr_bundle_seed_enabled
    description: 是否启用 Git Bundle 作为仓库源
    owner: teleport-module

  - name: tengu_ccr_bundle_max_bytes
    description: Git Bundle 最大大小（字节）
    default: 104857600
    owner: teleport-module

  - name: CCR_FORCE_BUNDLE
    description: 强制使用 Bundle 模式（环境变量）
    owner: teleport-module

  - name: CCR_ENABLE_BUNDLE
    description: 启用 Bundle 模式（环境变量）
    owner: teleport-module

telemetry:
  events:
    - tengu_teleport_started
    - tengu_teleport_resume_session
    - tengu_teleport_errors_detected
    - tengu_teleport_errors_resolved
    - tengu_teleport_error_git_not_clean
    - tengu_teleport_error_repo_not_in_git_dir_sessions_api
    - tengu_teleport_error_repo_mismatch_sessions_api
    - tengu_teleport_error_session_not_found_404
    - tengu_teleport_bundle_mode
    - tengu_teleport_source_decision
    - tengu_teleport_resume_error
    - tengu_ccr_bundle_upload

security_boundaries:
  - authentication: 仅 OAuth，不支持 API Key
  - repository_validation: 恢复前验证仓库匹配
  - no_auto_clean: 永不自动 stash/reset 用户工作区
  - environment_variables_write_only: 会话环境变量写只读
  - token_scrubbing: 服务端日志自动 scrub 敏感数据

known_integrations:
  - component: ResumeTask
    description: 会话列表选择器
    path: src/components/ResumeTask.tsx
    owner: teleport-module

  - component: conversationRecovery
    description: 会话恢复消息反序列化
    path: src/utils/conversationRecovery.ts
    owner: teleport-module

  - component: githubRepoPathMapping
    description: 仓库-路径映射管理
    path: src/utils/githubRepoPathMapping.ts
    owner: teleport-module

  - component: background/remote/preconditions
    description: 前置条件检查
    path: src/utils/background/remote/preconditions.ts
    owner: teleport-module
