    owner: "commands-framework"
    note: "命令定义，本文只描述加载"
  - path: "src/commands/**"
    owner: "commands-framework"
    note: "命令实现，本文只描述加载"
  - path: "src/utils/model/**"
    owner: "model-api"
    note: "模型 API，本文只描述预连接"
  - path: "src/utils/permissions/**"
    owner: "permissions"
    note: "权限系统，本文只描述初始化检查"
  - path: "src/utils/settings/**"
    owner: "settings"
    note: "设置系统，本文只描述 eager loading"
  - path: "src/services/session-persistence/**"
    owner: "session-persistence"
    note: "会话持久化，本文只描述恢复"
  - path: "src/utils/swarm/**"
    owner: "agent-swarms"
    note: "Agent swarms，本文只描述初始化"
  - path: "src/utils/worktree.ts"
    owner: "other"
    note: "Worktree，本文只描述启动时创建"
  - path: "src/services/plugins/**"
    owner: "plugins"
    note: "插件系统，本文只描述初始化"
  - path: "src/skills/**"
    owner: "skills"
    note: "技能系统，本文只描述初始化"
  - path: "src/services/mcp/**"
