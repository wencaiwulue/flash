schema_version: 1
spec_id: git-integration
spec: ../../superpowers/specs/2026-11-12-git-integration-design.md
status: draft

groups:
  - id: git-core
    kind: source
    section: 4
    summary: Git 仓库发现、分支/HEAD 读取、远程 URL、状态读取、裸仓库防护、变更文件列表
    files:
      - src/utils/git.ts

  - id: git-filesystem
    kind: source
    section: 4
    summary: Git 元数据直接读取、文件监控缓存、ref/SHA 验证、Git 目录解析、config 解析
    files:
      - src/utils/git/gitFilesystem.ts
      - src/utils/git/gitConfigParser.ts

  - id: git-ignore
    kind: source
    section: 4
    summary: Gitignore 解析工具
    files:
      - src/utils/git/gitignore.ts

  - id: git-diff
    kind: source
    section: 4
    summary: Git diff 解析、统计、hunks 处理、单文件 diff、未跟踪文件处理
    files:
      - src/utils/gitDiff.ts

  - id: worktree
    kind: source
    section: 4
    summary: Worktree 创建/恢复/清理、slug 验证、tmux 集成、stale agent worktree 回收、代理 Worktree
    files:
      - src/utils/worktree.ts

  - id: github-integration
    kind: source
    section: 4
    summary: GitHub 认证状态、远程 URL 解析与标准化、仓库哈希
    files:
      - src/utils/github/ghAuthStatus.ts
      - src/utils/git.ts # getGithubRepo、normalizeGitRemoteUrl、getRepoRemoteHash

  - id: commit-attribution
    kind: source
    section: 4
    summary: 提交贡献跟踪、计算、trailer 格式化、prepare-commit-msg 钩子集成、内部模型名白名单
    files:
      - src/utils/commitAttribution.ts
      - src/utils/attributionTrailer.ts
      - src/utils/attributionHooks.ts
      - src/utils/attribution.ts

  - id: pr-reference
    kind: source
    section: 4
    summary: PR 引用解析（如 #123、pr/123）
    files:
      - src/utils/prReference.ts

  - id: git-tests
    kind: test
    section: 7
    summary: Git 相关测试
    files:
      - tests/changedFiles.test.ts
