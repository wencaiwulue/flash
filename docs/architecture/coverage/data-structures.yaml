    files:
      - src/utils/contentArray.ts
  - id: generators
    kind: source
    section: 4
    summary: 异步生成器工具 - lastX（取最后值）、returnValue（取返回值）、all（并发控制）、toArray/fromArray
    files:
      - src/utils/generators.ts
  - id: memoize
    kind: source
    section: 4
    summary: 记忆化缓存 - memoizeWithTTL（stale-while-revalidate）、memoizeWithTTLAsync（含
      in-flight 去重）、memoizeWithLRU（基于 lru-cache）
    files:
      - src/utils/memoize.ts
