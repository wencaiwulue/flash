    kind: source
    section: 4
    summary: 延迟 Schema 初始化 - 模块加载时不创建，首次访问时调用 factory，避免循环依赖
    files:
      - src/utils/lazySchema.ts
  - id: json-utils
    kind: source
    section: 4
    summary: JSON/JSONC/JSONL 工具 - safeParseJSON（带 LRU
      缓存）、safeParseJSONC、parseJSONL、readJSONLFile、addItemToJSONCArray
    files:
      - src/utils/json.ts
  - id: json-read
    kind: source
    section: 4
    summary: BOM 剥离工具 - stripBOM，独立模块避免循环依赖，处理 PowerShell 5.x UTF-8 with BOM
