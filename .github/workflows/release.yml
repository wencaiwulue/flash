name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Validate shell installer
        run: sh -n scripts/install.sh
      - id: version
        name: Validate package and tag versions
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            bun scripts/build-binary.ts --release-tag "$RELEASE_TAG" --validate-only
          else
            bun scripts/build-binary.ts --validate-only
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            runner: macos-15
            target: bun-darwin-arm64
          - name: darwin-x64
            runner: macos-15-intel
            target: bun-darwin-x64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: bun-linux-arm64
          - name: linux-x64
            runner: ubuntu-24.04
            target: bun-linux-x64
          - name: windows-arm64
            runner: windows-11-arm
            target: bun-windows-arm64
          - name: windows-x64
            runner: windows-latest
            target: bun-windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chrome if missing (best effort)
        if: runner.os == 'Windows' || matrix.target == 'bun-linux-arm64'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            CHROME="/c/Program Files/Google/Chrome/Application/chrome.exe"
            if [[ ! -f "$CHROME" ]]; then
              echo "Chrome missing; installing via winget (ARM64 runners get the native ARM64 build)"
              winget install --id Google.Chrome --exact --silent \
                --accept-package-agreements --accept-source-agreements \
                || echo "winget install failed; the smoke will skip"
            else
              echo "Chrome already present"
            fi
          else
            if ! command -v google-chrome >/dev/null 2>&1 && ! [[ -f /opt/google/chrome/chrome ]]; then
              echo "Chrome missing on linux-arm64 (no official Google build); installing Chromium via playwright and symlinking"
              bun x playwright install --with-deps chromium >/dev/null 2>&1 || true
              CHROMIUM_BIN="$(find ~/.cache/ms-playwright -path '*chromium*' -name chrome -type f 2>/dev/null | head -1)"
              echo "resolved chromium binary: ${CHROMIUM_BIN:-<none>}"
              if [[ -n "$CHROMIUM_BIN" ]]; then
                # Playwright's chrome channel probes exactly /opt/google/chrome/chrome
                # on Linux — /usr/bin symlinks are never consulted.
                sudo mkdir -p /opt/google/chrome
                sudo ln -sf "$CHROMIUM_BIN" /opt/google/chrome/chrome
                ls -la /opt/google/chrome/chrome
                "$CHROMIUM_BIN" --version 2>&1 | head -1
              else
                echo "playwright chromium download failed; the smoke will skip"
              fi
            else
              echo "Chrome already present"
            fi
          fi
      - name: Pre-warm Chrome for the smoke (Windows Defender cold-start)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          CHROME="/c/Program Files/Google/Chrome/Application/chrome.exe"
          # Diagnose the runner's Chrome remote-debugging posture: Chrome's
          # UserDataDir enterprise policy overrides the --user-data-dir
          # command line, which would make --remote-debugging-pipe fail with
          # "requires a non-default data directory".
          "$CHROME" --version || true
          (reg query "HKLM\\SOFTWARE\\Policies\\Google\\Chrome" /v UserDataDir 2>/dev/null || echo "no HKLM UserDataDir policy")
          (reg query "HKCU\\SOFTWARE\\Policies\\Google\\Chrome" /v UserDataDir 2>/dev/null || echo "no HKCU UserDataDir policy")
          (reg query "HKLM\\SOFTWARE\\Policies\\Google\\Chrome" 2>/dev/null | head -30 || true)
          if [[ -f "$CHROME" ]]; then
            # Fresh Windows VMs re-scan every Chrome DLL on first read under
            # Defender, which makes the smoke's real-browser launch exceed the
            # MCP request timeout. Warm with throwaway headless launches until
            # one finishes in <=5s (scan cache primed), capped at 6 rounds —
            # x64 Chrome under ARM64 emulation may never get there, which is
            # fine: the smoke then skips as perf-timeout as before.
            for i in 1 2 3 4 5 6; do
              START=$SECONDS
              # Per-launch timeout: a hung headless launch (seen on runner
              # VMs) must never stall the release build.
              timeout 60 "$CHROME" --headless --disable-gpu --dump-dom about:blank >/dev/null 2>&1 || true
              ELAPSED=$((SECONDS - START))
              echo "warm launch $i took ${ELAPSED}s"
              if [[ $ELAPSED -le 5 ]]; then
                echo "Chrome warm"
                break
              fi
            done
          else
            echo "Chrome not preinstalled on this runner; skipping pre-warm"
          fi
      - name: Compile, package, and smoke test
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            bun run build:binary -- --target "${{ matrix.target }}" --release-tag "$RELEASE_TAG"
          else
            bun run build:binary -- --target "${{ matrix.target }}"
          fi
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: |
            build/release/*.tar.gz
            build/release/*.zip
            build/release/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Download release candidates
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: build/release
          merge-multiple: true
      - name: Verify archives and aggregate checksums
        run: bun scripts/build-binary.ts --checksum-dir build/release
      - name: Verify aggregate manifest
        working-directory: build/release
        run: sha256sum -c SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            build/release/*.tar.gz
            build/release/*.zip
            build/release/SHA256SUMS
            scripts/install.sh
