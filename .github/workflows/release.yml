name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - id: version
        name: Validate package and tag versions
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            bun scripts/build-binary.ts --release-tag "$RELEASE_TAG" --validate-only
          else
            bun scripts/build-binary.ts --validate-only
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            runner: macos-15
            target: bun-darwin-arm64
          - name: darwin-x64
            runner: macos-15-intel
            target: bun-darwin-x64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: bun-linux-arm64
          - name: linux-x64
            runner: ubuntu-24.04
            target: bun-linux-x64
          - name: windows-arm64
            runner: windows-11-arm
            target: bun-windows-arm64
          - name: windows-x64
            runner: windows-latest
            target: bun-windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Compile, package, and smoke test
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            bun run build:binary -- --target "${{ matrix.target }}" --release-tag "$RELEASE_TAG"
          else
            bun run build:binary -- --target "${{ matrix.target }}"
          fi
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: |
            build/release/*.tar.gz
            build/release/*.zip
            build/release/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Download release candidates
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: build/release
          merge-multiple: true
      - name: Verify archives and aggregate checksums
        run: bun scripts/build-binary.ts --checksum-dir build/release
      - name: Verify aggregate manifest
        working-directory: build/release
        run: sha256sum -c SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            build/release/*.tar.gz
            build/release/*.zip
            build/release/SHA256SUMS
