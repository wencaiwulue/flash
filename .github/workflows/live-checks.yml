name: live-validation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun scripts/live-model-validation.ts
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          HOME: /tmp/flash-live-home
          CLAUDE_CONFIG_DIR: /tmp/flash-live-config

  skillhub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun scripts/live-skillhub-validation.ts
        env:
          CLAUDE_SKILL_REGISTRY_URL: ${{ vars.SKILLHUB_REGISTRY_URL }}
          CLAUDE_SKILL_REGISTRY_TOKEN: ${{ secrets.CLAUDE_SKILL_REGISTRY_TOKEN }}
          HOME: /tmp/flash-skillhub-home
          CLAUDE_CONFIG_DIR: /tmp/flash-skillhub-config

  cloud:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_ORG_UUID: ${{ secrets.CLAUDE_CODE_ORG_UUID }}
      CLAUDE_CODE_BASE_URL: ${{ secrets.CLAUDE_CODE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun scripts/live-cloud-validation.ts
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_ORG_UUID: ${{ secrets.CLAUDE_CODE_ORG_UUID }}
          CLAUDE_CODE_BASE_URL: ${{ secrets.CLAUDE_CODE_BASE_URL }}
          HOME: /tmp/flash-cloud-home
          CLAUDE_CONFIG_DIR: /tmp/flash-cloud-config

  desktop:
    if: vars.CLAUDE_DESKTOP_LIVE == '1'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun scripts/live-desktop-validation.ts
        env:
          CLAUDE_DESKTOP_LIVE: '1'
          HOME: /tmp/flash-desktop-home
          CLAUDE_CONFIG_DIR: /tmp/flash-desktop-config

