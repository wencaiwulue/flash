name: live-validation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun scripts/live-model-validation.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          HOME: /tmp/flash-live-home
          CLAUDE_CONFIG_DIR: /tmp/flash-live-config

  skillhub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun scripts/live-skillhub-validation.ts
        env:
          CLAUDE_SKILL_REGISTRY_URL: ${{ vars.SKILLHUB_REGISTRY_URL }}
          CLAUDE_SKILL_REGISTRY_TOKEN: ${{ secrets.CLAUDE_SKILL_REGISTRY_TOKEN }}
          HOME: /tmp/flash-skillhub-home
          CLAUDE_CONFIG_DIR: /tmp/flash-skillhub-config

