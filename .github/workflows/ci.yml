name: ci

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate SDK types
        run: bun run generate:sdk-types
      - name: Check design docs
        run: bun scripts/check-design-docs.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test
      - name: CLI smoke test
        run: |
          bun dist/main.js --version
          bun dist/main.js --help > /dev/null
      - name: SDK import smoke test
        run: bun -e "const sdk = await import('./dist/sdk.mjs'); if (typeof sdk.query !== 'function' || typeof sdk.createSdkMcpServer !== 'function') throw new Error('Invalid SDK exports')"
