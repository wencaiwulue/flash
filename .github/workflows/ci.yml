name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate SDK types
        run: bun run generate:sdk-types
      - name: Typecheck
        run: bun run typecheck
      - name: Check commit documentation
        run: |
          bun scripts/document-commits.ts
          bun scripts/check-commit-docs.ts
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      - name: CLI smoke test
        run: |
          bun dist/main.js --version
          bun dist/main.js --help > /dev/null
      - name: SDK import smoke test
        run: bun -e "const sdk = await import('./dist/sdk.mjs'); if (typeof sdk.query !== 'function' || typeof sdk.createSdkMcpServer !== 'function') throw new Error('Invalid SDK exports')"
